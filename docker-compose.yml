services:
  # Layanan Aplikasi PHP-FPM (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jurnal_pkl_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - jurnal_network
    depends_on:
      - db

  # Layanan Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: jurnal_pkl_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - jurnal_network
    depends_on:
      - app

  # Layanan Database (MySQL 8)
  db:
    image: mysql:8.0
    container_name: jurnal_pkl_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_jurnal
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jurnal_network

networks:
  jurnal_network:
    driver: bridge

volumes:
  db_data: